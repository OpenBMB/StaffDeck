name: Validate hardened Intel Node

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  intel:
    runs-on: macos-15-intel
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Exercise the pinned Intel runtime after hardened signing
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          python3 -c 'import runpy,sys; from pathlib import Path; runpy.run_path("packaging/fetch_sandbox_runtime.py")["_download_node_runtime"](Path(sys.argv[1]))' "$RUNNER_TEMP/staffdeck-jit"
          node="$RUNNER_TEMP/staffdeck-jit/bin/node"
          codesign --force --sign - --options runtime --entitlements packaging/macos-intel-node.entitlements "$node"
          codesign --verify --strict "$node"
          "$node" -e '
            if (process.arch !== "x64") process.exit(2)
            function increment(value) { return value + 1 }
            for (let i = 0; i < 100000; i++) {
              if (increment(i) !== i + 1) process.exit(1)
            }
            console.log("Hardened x64 Node compiled and executed JavaScript")
          '
