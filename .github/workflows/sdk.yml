name: SDK and CLI

on:
  pull_request:
    paths: ['sdk/**', 'backend/**', '.github/workflows/sdk.yml']
  push:
    branches: [main]
    paths: ['sdk/**', 'backend/**', '.github/workflows/sdk.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.14']
        httpx: ['0.27.2', '0.28.1']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e "./sdk/python[dev]" "httpx==${{ matrix.httpx }}"
      - run: python -m pytest sdk/python/tests -q
      - run: python -m ruff check sdk/python
      - run: python -m build sdk/python
      - run: python -m staffdeck --help
      - run: staffdeck-api --help

  integration:
    runs-on: ubuntu-latest
    env:
      ULTRARAG_DOTENV: /dev/null
      DATABASE_URL: 'sqlite://'
      APP_SECRET: sdk-ci-test-only
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install -e "./sdk/python[dev]" -e "./backend[dev]"
      - run: python -m build sdk/python
      - name: Install wheel without backend dependencies
        run: |
          python -m venv .dev/sdk-wheel
          .dev/sdk-wheel/bin/python -m pip install sdk/python/dist/*.whl
          .dev/sdk-wheel/bin/staffdeck-api --help
      - name: Real API and wheel subprocess regression tests
        run: |
          STAFFDECK_TEST_PYTHON="$PWD/.dev/sdk-wheel/bin/python" python -m pytest sdk/python/integration -q
          python -m pytest backend/tests/test_public_api_v1.py backend/tests/test_public_api_sessions.py -q
