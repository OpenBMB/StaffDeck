# Alembic 迁移配置。
#
# - script_location 用 %(here)s 展开为 backend/app/db/migrations 的绝对路径,不依赖
#   执行时的 CWD;迁移目录放在 app 包内,便于 wheel/PyInstaller 一并分发;
# - sqlalchemy.url 留空:alembic/env.py 会回退到应用配置
#   (app.config.get_settings().database_url);程序化调用(init_db)通过
#   Config.set_main_option("sqlalchemy.url", ...) 显式传入运行时 URL。
# - 本地验证示例:
#   cd backend && DATABASE_URL=sqlite:////tmp/staffdeck-alembic.db \
#       .venv/bin/python -m alembic upgrade head
[alembic]
script_location = %(here)s/app/db/migrations
prepend_sys_path = .
path_separator = os
sqlalchemy.url =
