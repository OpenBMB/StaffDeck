[project]
name = "skill-agent-loop-backend"
version = "0.1.0"
description = "FastAPI MVP for an enterprise Skill Agent Loop service"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.117.0,<0.121.0",
  # cryptography 49 macOS wheels dynamically link their bundled OpenSSL. PyInstaller
  # can then select Python's older libssl.3.dylib with the same basename, producing
  # an app that fails at startup with a missing SSL_get0_group_name symbol.
  "cryptography>=42.0.0,<49.0.0",
  "fastapi>=0.111.0",
  "greenlet>=3.0.3",
  "httpx>=0.27.0",
  # LLM JSON 输出本地修复兜底（_loads_llm_json，减少模型重试）
  "json-repair>=0.63.0",
  "openai>=1.40.0",
  "packaging>=24.0",
  "beautifulsoup4>=4.12.3",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  # Swagger/OpenAPI YAML 文件导入
  "pyyaml>=6.0.2",
  "pypdf>=4.2.0",
  "python-multipart>=0.0.9",
  "python-docx>=1.1.2",
  # Agent 广场「AI 幻灯片生成」导出 .pptx（与 python-docx 同一类文档生成依赖）
  "python-pptx>=1.0.2",
  "python-dotenv>=1.0.1",
  "requests>=2.32.0",
  "sqlmodel>=0.0.21",
  "tzdata>=2025.2",
  "uvicorn[standard]>=0.30.0",
  "ldap3>=2.9.1",
  # Redis 可选底座：缓存 / 分布式锁 / Pub/Sub（REDIS_HOST 未配置时功能自动禁用）
  "redis>=5.0.0",
  # 定时任务调度后端（SCHEDULER_BACKEND=rq 时启用；Redis 不可用自动降级为不调度）
  "rq>=1.16.0",
  "rq-scheduler>=0.13.0",
  # 远程 PostgreSQL（DATABASE_URL 指向 PG 时必需）
  "psycopg2-binary>=2.9.9",
  # OA 表单代填：解析电子发票 PDF 价税合计，自动计算报销总金额
  "pypdf>=5.0.0",
]

# 本地启动便捷入口（uv run 会把本项目装进 .venv 并暴露这两个命令）：
#   uv run serve       ← 等价 uvicorn single_port_app:app --host 127.0.0.1 --port 5173
#                        --log-config log.json --reload
#   uv run rq-worker   ← 定时任务独立 worker 进程（等价 python -m app.scheduled_tasks.rq_worker）
[project.scripts]
serve = "app.cli:serve"
rq-worker = "app.scheduled_tasks.rq_worker:main"

[project.optional-dependencies]
dev = [
  "jsonschema>=4.23.0",
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.5.0",
  "pytest-xdist>=3.8.0"
]
packaging = [
  "pyinstaller>=6.6.0",
  "certifi>=2024.2.2",
  "pyobjc-framework-Cocoa>=10.0; sys_platform == 'darwin'",
  "pyobjc-framework-WebKit>=10.0; sys_platform == 'darwin'"
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["desktop_launcher", "single_port_app"]

[tool.setuptools.packages.find]
include = ["app*", "mock_servers*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
